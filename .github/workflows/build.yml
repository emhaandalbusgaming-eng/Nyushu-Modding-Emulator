name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      - name: Decode signing key (optional)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.NYUSHU_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.NYUSHU_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APKs
        env:
          NYUSHU_KEYSTORE_PATH: ${{ secrets.NYUSHU_KEYSTORE_B64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          NYUSHU_KEYSTORE_PASSWORD: ${{ secrets.NYUSHU_KEYSTORE_PASSWORD }}
          NYUSHU_KEY_ALIAS: ${{ secrets.NYUSHU_KEY_ALIAS }}
          NYUSHU_KEY_PASSWORD: ${{ secrets.NYUSHU_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ || true
          cp app/build/outputs/apk/release/*.apk dist/ || true
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nyushu-optimizer-apk
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: core/build/reports/tests/**
